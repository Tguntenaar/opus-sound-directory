<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <style>
    .on-light { display: block; }
    .on-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .on-light { display: none; }
      .on-dark { display: block; }
    }
  </style>
  <g class="on-light">
    <rect width="64" height="64" rx="14" fill="#09090b"/>
    <circle cx="32" cy="32" r="19" stroke="#fafafa" stroke-width="4" fill="none"/>
    <circle cx="32" cy="32" r="8.5" fill="#8b5cf6"/>
  </g>
  <g class="on-dark">
    <circle cx="32" cy="32" r="22" stroke="#fafafa" stroke-width="4" fill="none"/>
    <circle cx="32" cy="32" r="8.5" fill="#8b5cf6"/>
  </g>
</svg>
